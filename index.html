<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIXORA ADMIN</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
font-family:Arial;
background:#071b34;
display:flex;
align-items:center;
justify-content:center;
height:100vh;
margin:0;
color:#fff;
}
.box{
width:420px;
background:#fff;
color:#111;
padding:30px;
border-radius:20px;
box-shadow:0 30px 80px rgba(0,0,0,.3);
}
input{
width:100%;
height:50px;
margin-bottom:15px;
padding:0 15px;
border:1px solid #dbe7f5;
border-radius:12px;
box-sizing:border-box;
}
button{
width:100%;
height:52px;
border:0;
border-radius:14px;
background:#176df7;
color:#fff;
font-weight:900;
font-size:16px;
cursor:pointer;
}
</style>
</head>
<body>

<div class="box">
<h2 style="text-align:center;margin-bottom:20px;">FIXORA LOGIN</h2>

<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="login()">تسجيل الدخول</button>

<p id="msg" style="margin-top:15px;text-align:center;"></p>
</div>

<script>

const SUPABASE_URL =
'https://kbnqrpkexkjzndunnxcq.supabase.co';

const SUPABASE_ANON_KEY =
'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtibnFycGtleGtqem5kdW5ueGNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2OTk5MTIsImV4cCI6MjA5NTI3NTkxMn0.zs1q4hmUDH80j6guhciKJbfi75aB3MAlD6sAvkGcZWU';

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

async function login(){

  const email =
    document.getElementById('email').value;

  const password =
    document.getElementById('password').value;

  const msg =
    document.getElementById('msg');

  const { data, error } =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

  if(error){
    msg.innerText = error.message;
    msg.style.color = 'red';
    return;
  }

  msg.innerText = 'تم تسجيل الدخول بنجاح';
  msg.style.color = 'green';

  console.log(data);
}

</script>

</body>
</html>
